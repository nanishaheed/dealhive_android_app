<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TV Listing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: #0b0b0b;
    color: #ffffff;
    font-family: Inter, system-ui, sans-serif;
  }

  .screen {
    max-width: 420px;
    margin: auto;
    padding: 16px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .back {
    width: 36px;
    height: 36px;
    border-radius: 18px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .title {
    font-size: 22px;
    font-weight: 600;
  }

  .subtitle {
    opacity: 0.7;
    margin: 8px 0 16px;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* Card */
  .card {
    background: #141414;
    border-radius: 20px;
    overflow: hidden;
  }

  .image-box {
    background: #ffffff;
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .image-box img {
    width: 100%;
    height: auto;
  }

  .card-content {
    padding: 14px;
  }

  .name {
    font-size: 15px;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .price {
    color: #3aa0ff;
    font-weight: 600;
    font-size: 18px;
    margin-bottom: 6px;
  }

  .rating {
    display;
    font-size: 14px;
    opacity: 0.85;
  }

  .star {
    color: #f5c542;
    margin-right: 4px;
  }

  /* Full-width last card */
  .full {
    grid-column: span 2;
  }
</style>
</head>

<body>
<div class="screen">

  <div class="header">
    <div class="back">←</div>
    <div class="title">TVs</div>
  </div>

  <div class="subtitle">3 Products</div>

  <div class="grid">

    <!-- Card 1 -->
    <div class="card">
      <div class="image-box">
        <img src="https://via.placeholder.com/300x180" alt="Samsung TV">
      </div>
      <div class="card-content">
        <div class="name">Samsung 55-inch 4K Crystal UHD Smart TV</div>
        <div class="price">₹47,990</div>
        <div class="rating">
          <span class="star">★</span>4.5 (5623)
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div class="image-box">
        <img src="https://via.placeholder.com/300x180" alt="Samsung QLED">
      </div>
      <div class="card-content">
        <div class="name">Samsung QLED Q60R 55-inch 4K TV</div>
        <div class="price">₹69,990</div>
        <div class="rating">
          <span class="star">★</span>4.6 (2145)
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card full">
      <div class="image-box">
        <img src="https://via.placeholder.com/600x200" alt="Odyssey OLED">
      </div>
      <div class="card-content">
        <div class="name">Samsung Odyssey OLED G9 49-inch Gaming Monitor</div>
        <div class="price">₹1,29,990</div>
        <div class="rating">
          <span class="star">★</span>4.7 (856)
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
